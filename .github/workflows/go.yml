name: Go

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The kortex coverage upload authenticates with the job's OIDC token.
      id-token: write
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 2

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version-file: 'go.mod'
        check-latest: true

    - name: Build
      run: go build -v ./...

    # Run the tests producing both a coverage profile and a JUnit XML.
    # go-junit-report converts `go test -json` output into JUnit. We must not
    # let a test failure abort the job, otherwise the upload steps below would
    # be skipped and we'd lose the very results that explain the failure —
    # `set -o pipefail` plus an explicit exit captures the test outcome for the
    # final step.
    - name: Test
      id: gotest
      continue-on-error: true
      run: |
        go install github.com/jstemmer/go-junit-report/v2@latest
        set -o pipefail
        go test -v -coverprofile=coverage.out -covermode=atomic -timeout 5m -json ./... \
          | "$(go env GOPATH)/bin/go-junit-report" -parser gojson -set-exit-code > junit.xml
        status=$?
        echo "test_exit=$status" >> "$GITHUB_OUTPUT"
        exit $status

    # kortex gets the same reports, sent by the uploader it serves (a public
    # repository cannot use its action) with the job's OIDC token: no secret.
    # A pull request from a fork gets no token and uploads nothing. Failing
    # here is a warning, never a failed build.
    - name: Upload coverage and test results to kortex
      if: ${{ !cancelled() }}
      run: |
        if ! curl -fsSL --retry 3 https://kortex.plakar.io/dl/kortex-linux-amd64 -o "$RUNNER_TEMP/kortex"; then
          echo "::warning title=kortex coverage upload::could not fetch the uploader"
          exit 0
        fi
        chmod +x "$RUNNER_TEMP/kortex"
        "$RUNNER_TEMP/kortex" coverage upload --url https://kortex.plakar.io coverage.out junit.xml

    # Surface a genuine test failure now that the results have been uploaded.
    - name: Fail if tests failed
      if: ${{ steps.gotest.outputs.test_exit != '0' }}
      run: exit 1

    # Bounded fuzzing of the chunker invariants (reconstruction, size contract,
    # buffer-boundary determinism). The seed corpus already runs in the test
    # step above; this gives the mutator a short window to find new inputs on
    # every PR without lengthening CI noticeably. Any crasher is written to
    # testdata/fuzz and fails the job.
    - name: Fuzz chunkers
      run: go test ./tests/ -run '^$' -fuzz '^FuzzChunker$' -fuzztime 30s
